
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Producto | URBAN STYLE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <a href="index.html">URBAN STYLE</a>

        <nav>
            <a href="index.html">INICIO</a>
            <a href="catalogo.html">CATÁLOGO</a>
            <a href="index.html#nosotros">NOSOTROS</a>
            <a href="index.html#contacto">CONTACTO</a>
        </nav>

        <div class="acciones-header">
            <a href="carrito.html">CARRITO</a>
        </div>
    </header>

    <main>

        <section id="detalle-producto">

            <div class="imagen-detalle">
                <img src="imagenes/sudadera.jpg" alt="Sudadera Urban">
            </div>

            <div class="informacion-producto">

                <h1>SUDADERA URBAN</h1>

                <p>
                    Una prenda diseñada para combinar comodidad,
                    personalidad y estilo urbano.
                </p>

                <span class="precio-producto">$120.000 COP</span>

                <h3>Selecciona tu talla</h3>

                <div class="tallas">
                    <button type="button" class="talla">S</button>
                    <button type="button" class="talla">M</button>
                    <button type="button" class="talla">L</button>
                    <button type="button" class="talla">XL</button>
                </div>

                <button class="boton-principal" id="agregar-carrito">
                    AGREGAR AL CARRITO
                </button>

                <p id="mensaje-carrito"></p>

                <a href="catalogo.html">VOLVER AL CATÁLOGO</a>

            </div>

        </section>

    </main>

    <script src="producto.js"></script>

</body>

</html>
