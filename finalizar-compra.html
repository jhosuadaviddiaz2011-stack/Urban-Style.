
<!DOCTYPE html>

    <main id="finalizar-compra">

        <h1>FINALIZAR COMPRA</h1>

        <p>Completa tus datos para realizar tu pedido.</p>


<form id="formulario-compra">

    <label for="nombre">Nombre completo</label>
    <input type="text" id="nombre" placeholder="Tu nombre" required>

    <label for="correo">Correo electrónico</label>
    <input type="email" id="correo" placeholder="ejemplo@gmail.com" required>

    <label for="telefono">Teléfono</label>
    <input type="tel" id="telefono" placeholder="Tu número de teléfono" required>

    <label for="direccion">Dirección de entrega</label>
    <input type="text" id="direccion" placeholder="Tu dirección" required>

    <label for="ciudad">Ciudad</label>
    <input type="text" id="ciudad" placeholder="Tu ciudad" required>

    <button type="submit" class="boton-principal">
        CONFIRMAR PEDIDO
    </button>

</form>

<div id="resumen-pedido"></div>

    </main>

    <script src="finalizar-compra.js"></script>

</body>
</html>
